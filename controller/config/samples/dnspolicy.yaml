apiVersion: dns.dnspolicies.io/v1alpha1
kind: DnsPolicy
metadata:
  labels:
    app.kubernetes.io/name: dns-mesh-controller
    app.kubernetes.io/managed-by: kustomize
  name: dnspolicy
spec:
  targetSelector:
    app: frontend
  # BlockList defines domain patterns that are blocked
  blockList:
    - "deb.debian.org"
    - "ifconfig.co"