name: controller-e2e-built-and-test-stack

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push-controller:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Tag Name
        id: get_tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build Docker image
        id: build_img
        working-directory: controller
        run: |
          #!/bin/bash
          export IMG=${IMAGE_TO_BUILD}
          make docker-buildx
        env:
          IMAGE_TO_BUILD: "${{ secrets.DOCKERHUB_USERNAME }}/dashdns-controller:${{ env.TAG }}"

  build-and-push-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Tag Name
        id: get_tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build Docker image
        id: build_img
        working-directory: webhook
        run: |
          #!/bin/bash
          export IMG=${IMAGE_TO_BUILD}
          make docker-buildx
        env:
          IMAGE_TO_BUILD: "${{ secrets.DOCKERHUB_USERNAME }}/dashdns-admission-webhook:${{ env.TAG }}"

  test-entire-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Extract Tag Name
        id: get_tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Setup Test Suite & Apply
        id: build_img
        run: |
          #!/bin/bash
          ./setup-test-suite.sh $IMAGE_TO_BUILD
        env:
          IMAGE_TO_BUILD: "${{ env.TAG }}"