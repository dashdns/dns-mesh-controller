webhook:
  image: emirozbir/dashdns-admission-webhook:fix-directory-structure
  replicas: 1
  pullPolicy: Always
  tag: "latest"
  dns_service:
    name: dnsd-dashdns
    namespace: "default"
  certChain:
    ca: ""
    cert: ""
    key: ""
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

controller:
  replicaCount: 1
  image:
    repository: docker.io/emirozbir/dashdns-controller
    pullPolicy: IfNotPresent
    tag: "fix-directory-structure"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext: {}
  service:
    type: ClusterIP
    port: 8443
    apiPort: 5959

  kubeDns:
    namespace: kube-system
    secretName: kube-dns-tls

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}